name: advanced_in_app_review
description: Native in-app reviews for Android and iOS with persistent session, time and significant-event conditions and actionable request diagnostics.
version: 2.1.0
homepage: https://eeoom.com
repository: https://github.com/eeoom/advanced_in_app_review
issue_tracker: https://github.com/eeoom/advanced_in_app_review/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  plugin:
    platforms:
      android:
        package: com.eeoom.advanced_in_app_review
        pluginClass: AdvancedInAppReviewPlugin
      ios:
        pluginClass: AdvancedInAppReviewPlugin
