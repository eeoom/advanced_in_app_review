name: Verify
on:
  push:
  pull_request:

jobs:
  dart-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test test/widget_test.dart --no-pub
        working-directory: example
      - run: flutter build apk --debug --no-pub
        working-directory: example
      - run: ./gradlew :advanced_in_app_review:testDebugUnitTest
        working-directory: example/android

  ios:
    runs-on: macos-latest
    strategy:
      matrix:
        package-manager: [swiftpm, cocoapods]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select package manager
        if: matrix.package-manager == 'cocoapods'
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Build SwiftPM example
        if: matrix.package-manager == 'swiftpm'
        run: flutter build ios --simulator --debug --no-pub
        working-directory: example
      - name: Build a fresh CocoaPods host
        if: matrix.package-manager == 'cocoapods'
        run: |
          flutter create --platforms=ios --no-pub --project-name review_cocoapods_check "$RUNNER_TEMP/review_cocoapods_check"
          cd "$RUNNER_TEMP/review_cocoapods_check"
          flutter pub add advanced_in_app_review --path "$GITHUB_WORKSPACE"
          flutter build ios --simulator --debug --no-pub
      - name: Native iOS smoke test
        if: matrix.package-manager == 'swiftpm'
        working-directory: example
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for r,ds in json.load(sys.stdin)["devices"].items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          flutter test integration_test/native_review_test.dart -d "$device"
